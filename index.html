<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to My Website</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            width: 500px;
        }

        h1 {
            color: #0077cc;
            margin-bottom: 15px;
        }

        p {
            color: #555;
            margin-bottom: 20px;
            font-size: 18px;
        }

        .btn {
            display: inline-block;
            padding: 12px 25px;
            background: #0077cc;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: 0.3s;
        }

        .btn:hover {
            background: #005fa3;
        }

        footer {
            margin-top: 25px;
            color: gray;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>🚀 Welcome to My Website</h1>

    <p>This webpage is successfully deployed.</p>

    <p>
        <strong>AWS | Docker | Kubernetes | Jenkins | DevOps</strong>
    </p>

    <a href="https://www.google.com" class="btn" target="_blank">
        Learn More
    </a>

    <footer>
        <p>© 2026 Prasanth | DevOps Demo Application</p>
    </footer>
</div>

</body>
</html>
